name: Build server executable

on:
  push:

permissions:
  contents: write

jobs:
  decision:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(python -c 'from micobooks_scraper.version import __version__; print(__version__)')"
          previous=""
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            previous="$(git show HEAD^:micobooks_scraper/version.py 2>/dev/null | python -c 'import sys; from micobooks_scraper.release import extract_version; print(extract_version(sys.stdin.read()) or "")')"
          fi
          build="$(python -c 'import sys; from micobooks_scraper.release import should_build; print("true" if should_build(sys.argv[1], sys.argv[2] or None) else "false")' "$current" "$previous")"
          echo "Current version: $current"
          echo "Previous version: ${previous:-<none>}"
          echo "Build executable: $build"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: decision
    if: needs.decision.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            extension: .exe
          - os: ubuntu-latest
            platform: linux-x64
            extension: ""
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            extension: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build executable
        shell: bash
        run: |
          python build_executable.py --name "micobooks-server-${{ needs.decision.outputs.version }}-${{ matrix.platform }}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: micobooks-server-${{ needs.decision.outputs.version }}-${{ matrix.platform }}
          path: dist/micobooks-server-${{ needs.decision.outputs.version }}-${{ matrix.platform }}${{ matrix.extension }}

  release:
    needs: [decision, build]
    if: needs.decision.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download executable artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: micobooks-server-${{ needs.decision.outputs.version }}-*
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release="v${{ needs.decision.outputs.version }}"
          title="Micobooks Server ${{ needs.decision.outputs.version }}"
          if gh release view "$release" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$release" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$release" dist/* \
              --repo "$GH_REPO" \
              --target "${{ github.sha }}" \
              --title "$title" \
              --generate-notes
          fi
